[project]
name = "purdue-seat-watch"
version = "0.1.0"
description = "Watches Purdue Banner class seat counts and notifies you the moment a full course opens up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "httpx>=0.27"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "resend>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
purdue-seat-watch = "purdue_seat_watch.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["purdue_seat_watch*"]

[tool.setuptools.package-data]
purdue_seat_watch = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
